schemaVersion: "1.0"
solution:
  name: "ДомПульс"
  teamId: "REPLACE_WITH_HACKATHON_TEAM_ID"
api:
  baseUrl: "https://dompuls-production.up.railway.app"
  openapi: "./openapi.yaml"
  defaultHeaders:
    Accept: "application/json"
  checks:
    - id: "health"
      name: "SQLite-backed service health"
      description: "Operational health check, not a product API endpoint."
      method: "GET"
      path: "/health"
      role: "public"
      expected:
        statusCodes: [200]
        contentType: "application/json"
        requiredFields: ["ok"]
        bodySchema:
          type: object
          required: ["ok"]
          properties:
            ok:
              const: true
      timeoutMs: 5000
      repeatable: true
    - id: "public-config"
      name: "Public pilot configuration"
      method: "GET"
      path: "/api/config"
      role: "public"
      expected:
        statusCodes: [200]
        contentType: "application/json"
        requiredFields: ["development", "synthetic", "grouping", "note", "buildings", "maxConfigured"]
        bodySchema:
          type: object
          required: ["development", "synthetic", "grouping", "buildings", "maxConfigured"]
          properties:
            development:
              const: false
            synthetic:
              const: false
            grouping:
              const: "reported-place"
            buildings:
              type: array
              minItems: 1
            maxConfigured:
              type: boolean
      timeoutMs: 5000
      repeatable: true
    - id: "session-state"
      name: "Session state without cookie"
      description: "Reproducible unauthenticated check; does not create an account or change data."
      method: "GET"
      path: "/api/session"
      role: "public"
      expected:
        statusCodes: [200]
        contentType: "application/json"
        requiredFields: ["authenticated", "admin", "source"]
        bodySchema:
          type: object
          required: ["authenticated", "admin", "source"]
          properties:
            authenticated:
              const: false
            admin:
              const: false
            source:
              const: null
      timeoutMs: 5000
      repeatable: true
    - id: "max-login-requires-signed-data"
      name: "Reject login without signed MAX launch data"
      description: "A negative auth check; it does not create a session or modify resident data."
      method: "POST"
      path: "/api/session"
      role: "public"
      request:
        headers:
          Content-Type: "application/json"
          Origin: "https://dompuls-production.up.railway.app"
          X-DomPulse-Request: "1"
        body: {}
      expected:
        statusCodes: [401]
        contentType: "application/json"
        requiredFields: ["error"]
      timeoutMs: 5000
      repeatable: true
    - id: "state-requires-session"
      name: "Resident data requires a verified session"
      method: "GET"
      path: "/api/state?buildingId=itmo-vyazemsky"
      role: "public"
      expected:
        statusCodes: [401]
        contentType: "application/json"
        requiredFields: ["error"]
      timeoutMs: 5000
      repeatable: true
